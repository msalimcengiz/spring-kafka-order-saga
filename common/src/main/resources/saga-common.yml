# Settings shared by every service; imported from each service's application.yml.
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:saga}
    password: ${DATABASE_PASSWORD:saga}
    hikari:
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/common,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        isolation.level: read_committed
    listener:
      # Offset committed after each record's transaction has committed.
      ack-mode: record
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

saga:
  admin-token: ${ADMIN_TOKEN:dev-admin-token}
  kafka:
    partitions: 6
    replicas: ${KAFKA_REPLICATION:1}
    min-insync-replicas: ${KAFKA_MIN_INSYNC:1}
