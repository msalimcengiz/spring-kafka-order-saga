name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: unit + integration tests (Testcontainers Kafka and Postgres)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/target/*-reports/"

  chaos:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: DURATION=60 ./chaos/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: chaos/results/chaos.md

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:latest -strict -summary /w/rendered.yaml

  images:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [order-service, payment-service, inventory-service]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
